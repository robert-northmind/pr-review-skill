name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan all fetched history
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact --no-banner'

  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified TruffleHog binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trufflehog"
          cd "$RUNNER_TEMP/trufflehog"
          curl --fail --silent --show-error --location --retry 3 \
            --output trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.5/trufflehog_3.97.5_linux_amd64.tar.gz
          echo 'e3d97199c565c37ca6152750197f667e08ae6a1edf5911fbdec168622b28620c  trufflehog.tar.gz' | sha256sum --check
          tar -xzf trufflehog.tar.gz trufflehog

      - name: Verify findings filter
        run: python3 tests/run.py python test_trufflehog

      - name: Scan reachable history with TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trufflehog/trufflehog" git "file://$PWD" \
            --branch HEAD --no-verification --fail-on-scan-errors --no-update --json \
            | python3 .github/scripts/check_trufflehog.py
